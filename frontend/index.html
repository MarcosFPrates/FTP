<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Transfer Web Client</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-gray-200 font-sans">

    <header class="bg-gray-800 shadow-md p-4 sticky top-0 z-10">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold text-white">File Transfer Client</h1>
            <div id="connection-form" class="mt-4">
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                    <div class="md:col-span-1">
                        <label for="server" class="block text-sm font-medium text-gray-400">Servidor</label>
                        <input type="text" id="server" placeholder="ftp.example.com" class="mt-1 p-2 w-full bg-gray-700 border border-gray-600 rounded text-white">
                    </div>
                    <div class="md:col-span-1">
                        <label for="port" class="block text-sm font-medium text-gray-400">Porta</label>
                        <input type="number" id="port" placeholder="21" class="mt-1 p-2 w-full bg-gray-700 border border-gray-600 rounded text-white">
                    </div>
                    <div class="md:col-span-1">
                        <label for="user" class="block text-sm font-medium text-gray-400">Usuário</label>
                        <input type="text" id="user" placeholder="anonymous" class="mt-1 p-2 w-full bg-gray-700 border border-gray-600 rounded text-white">
                    </div>
                    <div class="md:col-span-1">
                        <label for="password" class="block text-sm font-medium text-gray-400">Senha</label>
                        <input type="password" id="password" class="mt-1 p-2 w-full bg-gray-700 border border-gray-600 rounded text-white">
                    </div>
                    <div class="md:col-span-1">
                        <button id="connect-btn" class="w-full bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition duration-300">
                            <i class="fas fa-plug mr-2"></i>Conectar
                        </button>
                    </div>
                    <div class="md:col-span-5 flex items-center space-x-4">
                        <label class="block text-sm font-medium text-gray-400">Protocolo:</label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="protocol" value="ftp" class="form-radio text-indigo-500 bg-gray-700" checked>
                            <span class="ml-2">FTP</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="protocol" value="smb" class="form-radio text-indigo-500 bg-gray-700">
                            <span class="ml-2">SMB</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 mt-4">
        <div id="main-content" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-4">

            <!-- File List Column -->
            <div class="lg:col-span-2 bg-gray-800 p-4 rounded-lg shadow-lg">
                <h2 class="text-xl font-semibold mb-4 text-white">Arquivos Remotos</h2>
                <div class="flex items-center space-x-2 mb-4">
                    <input type="date" id="start-date" class="p-2 bg-gray-700 border border-gray-600 rounded text-white">
                    <input type="date" id="end-date" class="p-2 bg-gray-700 border border-gray-600 rounded text-white">
                    <button id="filter-btn" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 transition">
                        <i class="fas fa-filter mr-2"></i>Filtrar
                    </button>
                </div>
                <div id="path-breadcrumbs" class="mb-2 text-gray-400 text-sm">/</div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="border-b border-gray-700">
                                <th class="p-2">Nome</th>
                                <th class="p-2">Tamanho</th>
                                <th class="p-2">Modificado em</th>
                                <th class="p-2">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="file-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- Downloads Column -->
            <div class="lg:col-span-1 bg-gray-800 p-4 rounded-lg shadow-lg">
                <h2 class="text-xl font-semibold mb-4 text-white">Downloads</h2>
                <div id="downloads-list" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <footer class="mt-8 text-center text-sm text-gray-500">
        <p>&copy; 2024 File Transfer Client. All rights reserved.</p>
    </footer>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
